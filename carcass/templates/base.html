<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.1.3/dist/darkly/bootstrap.min.css">
    {% block title %}{% endblock %}
</head>
<div class="container py-3">
    <header>
        <div class="d-flex flex-column flex-md-row align-items-center pb-3 mb-4 border-bottom">
            <a href="/home" class="d-flex align-items-center link-body-emphasis text-decoration-none">

                <span class="fs-4">GenChart</span>
            </a>

            <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
                <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="/vacation">Vacation</a>
                <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="/team">Team</a>

            </nav>
            <a class="btn btn-outline-primary" href="/addteam"><h5>+ Add employee</h5></a>
        </div>
    </header>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class=flashes>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}


    {% block body %}
    {% endblock %}

</div>
</html>
